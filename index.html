<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="runic-medallion.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waters of Yersu - Official Page</title>
    <style>
        /* Base Page Setup & Epic Yersu Background */
        body {
            margin: 0;
            padding: 0;
            background-image: url('yersu-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* The Main Layout Shield Wrapper */
        .wrapper {
            width: 95%;
            max-width: 1100px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Compact Header with Uniform 360° Outer Yersu Teal Glow */
        .header-panel {
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 25px #59e5d6; 
            border-radius: 4px;
            padding: 25px 40px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            min-height: 220px;
        }

        /* Expanded Left Container to give your Title Image full clearance */
        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            flex-grow: 1;
            max-width: 65%;
        }

        /* Uniform Wide Title Scaling */
        .brand-headline {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Small text placement formatting */
        .header-left p {
            margin: 0;
            font-size: 1.05rem;
            color: #8fa3a6;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Clickable Golden Kindle Promo Banner Link */
        .kindle-promo-link {
            text-decoration: none;
            display: inline-block;
            align-self: flex-start;
        }

        .kindle-promo {
            margin: 5px 0;
            font-size: 1.25rem;
            color: #d29a39; 
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(210, 154, 57, 0.4);
            transition: all 0.3s ease;
        }

        /* Hover glow effect for the big orange text line */
        .kindle-promo-link:hover .kindle-promo {
            color: #ffbe4a;
            text-shadow: 0 0 20px rgba(210, 154, 57, 0.95);
            transform: scale(1.01);
        }
        /* Seamless Row of Compact Storefront Navigation Icons */
        .icon-bar {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .icon-link {
            width: 40px;
            height: 40px;
            border: 2px solid #8fa3a6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #8fa3a6;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9rem;
            background: transparent;
        }

        /* SVG Vector Icon Global Formatting */
        .icon-link svg {
            width: 18px;
            height: 18px;
            fill: #8fa3a6;
            transition: fill 0.3s ease;
        }

        /* Standard Interactive Button Hover State */
        .icon-link:hover {
            border-color: #59e5d6;
            color: #59e5d6;
            box-shadow: 0 0 12px #59e5d6; 
            transform: translateY(-2px);
        }
        .icon-link:hover svg {
            fill: #59e5d6;
        }

        /* Custom Medallion Style Rules for Amazon Kindle Button */
        .icon-link.amazon-btn:hover {
            border-color: #d29a39;
            box-shadow: 0 0 12px rgba(210, 154, 57, 0.95);
            transform: scale(1.05) translateY(-2px);
        }
        .icon-link.amazon-btn:hover svg {
            fill: #d29a39;
        }

        /* Click State: High-Intensity Signature Teal Glow */
        .icon-link.amazon-btn:active {
            border-color: #59e5d6;
            box-shadow: 0 0 16px rgba(89, 229, 214, 0.98);
            transform: scale(0.98);
        }
        .icon-link.amazon-btn:active svg {
            fill: #59e5d6;
        }

        /* --- ARTIFACT PORTAL INTERFACE SYSTEM --- */
        .medallion-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            min-height: 240px;
        }

        .artifact-portal {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Restored to its original full-sized grandeur */
        .medallion-container {
            position: relative;
            width: clamp(220px, 28vw, 320px);
            height: clamp(220px, 28vw, 320px);
        }

        /* Circular-Masked Interactive Button Engine */
        .medallion-trigger-btn {
            width: 100%;
            height: 100%;
            background-image: url('runic-medallion.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: none !important;
            padding: 0 !important;
            cursor: pointer;
            outline: none !important;
            background-color: transparent;
            -webkit-mask-image: radial-gradient(circle, black 70%, transparent 71%);
            mask-image: radial-gradient(circle, black 70%, transparent 71%);
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        /* Hover state: Sharp, bright, gold edge-glow */
        .medallion-trigger-btn:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 0 12px rgba(210, 154, 57, 0.95));
        }

        /* Click state: 20-Degree Mechanical Spin with Teal glow */
        .medallion-trigger-btn.activated {
            transform: rotate(20deg) scale(1.02);
            filter: drop-shadow(0 0 16px rgba(89, 229, 214, 0.98));
        }

        /* Dynamic Hidden Input Area Container */
        .email-reveal-zone {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Expands layout view box once click executes */
        .email-reveal-zone.show {
            max-height: 80px;
            opacity: 1;
        }

        /* Sleek input form styling mapping */
        .runic-input {
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid #59e5d6;
            border-radius: 4px;
            padding: 10px 15px;
            color: #ffffff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-align: center;
            width: 240px;
            outline: none;
            box-shadow: 0 0 10px rgba(89, 229, 214, 0.2);
        }

        .runic-input:focus {
            box-shadow: 0 0 15px rgba(89, 229, 214, 0.6);
            border-color: #ffffff;
        }

        /* Custom static instruction layout script tracking */
        .artifact-instruction-text {
            font-size: 0.8rem;
            color: #d29a39; 
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(210, 154, 57, 0.2);
            text-align: center;
        }

        /* Pure Black Video Panel layout tracking 5 grid columns natively */
        .video-panel {
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 25px #59e5d6; 
            border-radius: 4px;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        /* Lock the YouTube Players into Vertical Cell Dimensions */
        .video-card {
            position: relative;
            width: 100%;
            padding-top: 177.77%; 
            border-radius: 4px;
            overflow: hidden;
            background-color: #111;
        }

        .video-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Smart-Stacking Rules For Mobile Phone Screens */
        @media (max-width: 768px) {
            .wrapper {
                margin: 15px auto;
                gap: 20px;
            }

            .header-panel {
                flex-direction: column-reverse;
                text-align: center;
                padding: 30px 20px;
                gap: 25px;
            }

            .header-left {
                max-width: 100%;
                align-items: center;
            }

            .brand-headline {
                max-width: 320px;
            }

            .kindle-promo {
                font-size: 1.1rem;
                text-align: center;
            }

            .medallion-box {
                min-height: auto;
            }

            .video-panel {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .video-card {
                max-width: 290px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">

        <!-- Header Row Section -->
        <div class="header-panel">
            <div class="header-left">
                <!-- Main Comic Logo Layout Anchor -->
                <img src="headline-logo.png" alt="Waters Of Yersu" class="brand-headline">
                <p>Official Page (Under Construction)</p>
                
                <!-- Gold Kindle Notification Alert (Forces new browser page) -->
                <a href="https://amazon.com" class="kindle-promo-link" target="_blank">
                    <div class="kindle-promo">ISSUE 1 & 2 ARE LIVE ON AMAZON KINDLE!</div>
                </a>
                
                <!-- Compact Checkout Navigation Badges -->
                <div class="icon-bar">
                    <!-- Amazon Vector Button: Features your exact gold & teal portal behavior rules -->
                    <a href="https://amazon.com" class="icon-link amazon-btn" title="Buy from Amazon Kindle" target="_blank">
                        <svg viewBox="0 0 24 24" xmlns="http://w3.org">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </a>
                    <a href="https://google.com" class="icon-link" title="Google Books" target="_blank">G</a>
                    <a href="https://youtube.com" class="icon-link" title="YouTube Channel" target="_blank">Y</a>
                    <a href="#" class="icon-link" title="Discord">D</a>
                    <a href="#" class="icon-link" title="Contact">?</a>
                </div>
            </div>

            <!-- Custom Interactive Artifact Box Anchor Point -->
            <div class="medallion-box">
                <div class="artifact-portal">
                    <div class="medallion-container">
                        <button type="button" id="artifactBtn" class="medallion-trigger-btn" title="Click to activate artifact"></button>
                    </div>
                    
                    <div class="artifact-instruction-text">Activate the artifact to reach Yersu</div>
                    
                    <div id="revealZone" class="email-reveal-zone">
                        <form action="https://formspree.io" method="POST">
                            <input type="email" name="email" class="runic-input" placeholder="ENTER EMAIL TO COMPLETE..." required>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5-Column True Native Embed YouTube Player Grid -->
        <div class="video-panel">
            <div class="video-card">
                <iframe src="https://youtube.com" title="Yersu Teaser" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://youtube.com" title="Ong Teaser" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://youtube.com" title="Selen Teaser" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://youtube.com" title="Teaser 4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://youtube.com" title="Teaser 5" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
        </div>

    </div>

    <script>
        const artifactBtn = document.getElementById('artifactBtn');
        const revealZone = document.getElementById('revealZone');
        const artifactPortal = document.querySelector('.artifact-portal');

        // Toggle activation on medallion click
        artifactBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            artifactBtn.classList.toggle('activated');
            revealZone.classList.toggle('show');
        });

        // Smart Outside Click Cancel Mechanism
        document.addEventListener('click', (e) => {
            if (!artifactPortal.contains(e.target)) {
                artifactBtn.classList.remove('activated');
                revealZone.classList.remove('show');
            }
        });
    </script>

</body>
</html>
