<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="runic-medallion.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waters of Yersu - Official Page</title>
    <style>
        /* Base Page Setup & Epic Yersu Background */
        body {
            margin: 0;
            padding: 0;
            background-image: url('yersu-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* The Main Layout Shield Wrapper */
        .wrapper {
            width: 95%;
            max-width: 1100px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Compact Header with Uniform 360° Outer Yersu Teal Glow */
        .header-panel {
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 25px #59e5d6; 
            border-radius: 4px;
            padding: 25px 40px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            min-height: 220px;
        }

        /* Expanded Left Container to give your Title Image full clearance */
        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            flex-grow: 1;
            max-width: 65%;
        }

        /* Uniform Wide Title Scaling */
        .brand-headline {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Small text placement formatting */
        .header-left p {
            margin: 0;
            font-size: 1.05rem;
            color: #8fa3a6;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Custom Medallion Golden Kindle Promo Banner */
        .kindle-promo {
            margin: 5px 0;
            font-size: 1.25rem;
            color: #d29a39; 
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(210, 154, 57, 0.4);
        }

        /* Seamless Row of Compact Storefront Navigation Icons */
        .icon-bar {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .icon-link {
            width: 40px;
            height: 40px;
            border: 2px solid #8fa3a6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #8fa3a6;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .icon-link:hover {
            border-color: #59e5d6;
            color: #59e5d6;
            box-shadow: 0 0 12px #59e5d6; 
            transform: translateY(-2px);
        }

        /* --- NEW ARTIFACT PORTAL INTERFACE SYSTEM --- */
        .medallion-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            min-height: 240px;
        }

        .artifact-portal {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* The Button Box Container */
        .medallion-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        /* Circular-Masked Interactive Button Engine */
        .medallion-trigger-btn {
            width: 100%;
            height: 100%;
            background-image: url('runic-medallion.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: none !important;
            padding: 0 !important;
            cursor: pointer;
            outline: none !important;
            background-color: transparent;
            /* Mask forces mouse clicks strictly on circular graphic ink pixels */
            -webkit-mask-image: radial-gradient(circle, black 70%, transparent 71%);
            mask-image: radial-gradient(circle, black 70%, transparent 71%);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease;
        }

        /* Hover: Medallion expands and flares amber gold */
        .medallion-trigger-btn:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 0 25px rgba(210, 154, 57, 0.8));
        }

        /* Smooth 20-Degree Mechanical Clockwise Rotation triggered by JavaScript class toggle */
        .medallion-trigger-btn.activated {
            transform: rotate(20deg) scale(1.02);
            filter: drop-shadow(0 0 35px #59e5d6); /* Flashes into signature Teal */
        }

        /* Dynamic Hidden Input Area Container */
        .email-reveal-zone {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Expands layout view box once class injection executes */
        .email-reveal-zone.show {
            max-height: 80px;
            opacity: 1;
        }

        /* Sleek input form styling mapping */
        .runic-input {
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid #59e5d6;
            border-radius: 4px;
            padding: 10px 15px;
            color: #ffffff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-align: center;
            width: 240px;
            outline: none;
            box-shadow: 0 0 10px rgba(89, 229, 214, 0.2);
        }

        .runic-input:focus {
            box-shadow: 0 0 15px rgba(89, 229, 214, 0.6);
            border-color: #ffffff;
        }

        /* Custom static instruction layout script tracking */
        .artifact-instruction-text {
            font-size: 0.8rem;
            color: #d29a39; 
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(210, 154, 57, 0.2);
            text-align: center;
        }

        /* Pure Black Video Panel with Glowing Yersu Teal Outer Glow */
        .video-panel {
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 25px #59e5d6; 
            border-radius: 4px;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Lock the YouTube Players into Vertical Cell Dimensions */
        .video-card {
            position: relative;
            width: 100%;
            padding-top: 177.77%; 
            border-radius: 4px;
            overflow: hidden;
            background-color: #111;
        }

        .video-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Smart-Stacking Rules For Mobile Phone Screens */
        @media (max-width: 768px) {
            .wrapper {
                margin: 15px auto;
                gap: 20px;
            }

            .header-panel {
                flex-direction: column-reverse;
                text-align: center;
                padding: 30px 20px;
                gap: 25px;
            }

            .header-left {
                max-width: 100%;
                align-items: center;
            }

            .brand-headline {
                max-width: 320px;
            }

            .kindle-promo {
                font-size: 1.1rem;
                text-align: center;
            }

            .medallion-box {
                min-height: auto;
            }

            .video-panel {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .video-card {
                max-width: 290px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- Header Row Section -->
        <div class="header-panel">
            <div class="header-left">
                <!-- Main Comic Logo Layout Anchor -->
                <img src="headline-logo.png" alt="Waters Of Yersu" class="brand-headline">
                <p>Official Page (Under Construction)</p>
                
                <!-- Gold Kindle Notification Alert -->

                    <a href="#" class="icon-link" title="Discord">D</a>
                    <a href="#" class="icon-link" title="Contact">?</a>
                </div>
            </div>

            <!-- Custom Interactive Artifact Box Anchor Point -->
            <div class="medallion-box">
                <div class="artifact-portal">
                    <div class="medallion-container">
