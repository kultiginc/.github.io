<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="runic-medallion.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waters of Yersu - Official Page</title>
    <style>
        /* Base Page Setup & Epic Yersu Background */
        body {
            margin: 0;
            padding: 0;
            background-image: url('yersu-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* The Main Layout Shield Wrapper */
        .wrapper {
            width: 95%;
            max-width: 1100px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Compact Header with Uniform 360° Outer Yersu Teal Glow */
        .header-panel {
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 25px #59e5d6; 
            border-radius: 4px;
            padding: 25px 40px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            min-height: 220px; /* Increased slightly to accommodate larger assets */
        }

        /* Expanded Left Container to give your Title Image full clearance */
        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            flex-grow: 1;
            max-width: 65%;
        }

        /* Uniform Wide Title Scaling */
        .brand-headline {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Small text placement formatting */
        .header-left p {
            margin: 0;
            font-size: 1.05rem;
            color: #8fa3a6;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Expanded Medallion Box to match your selection zone height */
        .medallion-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            height: 100%;
            min-height: 200px; /* Matches selection zone height */
        }

        .medallion-box img {
            width: clamp(220px, 28vw, 320px); /* Expanded upper limits to fill your selection box fully */
            height: auto;
            display: block;
            border: none !important; 
            outline: none !important;
            object-fit: contain;
        }

        /* Seamless Row of Compact Storefront Navigation Icons */
        .icon-bar {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .icon-link {
            width: 40px;
            height: 40px;
            border: 2px solid #8fa3a6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #8fa3a6;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .icon-link:hover {
            border-color: #59e5d6;
            color: #59e5d6;
            box-shadow: 0 0 12px #59e5d6; 
            transform: translateY(-2px);
        }

        /* Pure Black Video Panel with Glowing Yersu Teal Outer Glow */
        .video-panel {
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 25px #59e5d6; 
            border-radius: 4px;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Lock the YouTube Players into Vertical Cell Dimensions */
        .video-card {
            position: relative;
            width: 100%;
            padding-top: 177.77%; 
            border-radius: 4px;
            overflow: hidden;
            background-color: #111;
        }

        .video-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Smart-Stacking Rules For Mobile Phone Screens */
        @media (max-width: 768px) {
            .wrapper {
                margin: 15px auto;
                gap: 20px;
            }

            .header-panel {
                flex-direction: column-reverse;
                text-align: center;
                padding: 30px 20px;
                gap: 25px;
            }

            .header-left {
                max-width: 100%;
                align-items: center;
            }

            .brand-headline {
                max-width: 320px;
            }

            .medallion-box {
                min-height: auto;
            }

            .medallion-box img {
                width: 200px;
            }

            .icon-bar {
                justify-content: center;
            }

            .video-panel {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .video-card {
                max-width: 290px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- Header Row Section -->
        <div class="header-panel">
            <div class="header-left">
                <!-- Main Comic Logo Layout Anchor -->
                <img src="headline-logo.png" alt="Waters Of Yersu" class="brand-headline">
                <p>Official Page (Under Construction)</p>
                
                <!-- Compact Checkout Navigation Badges -->
                <div class="icon-bar">
                    <a href="https://amazon.com" class="icon-link" title="Amazon Kindle" target="_blank">a</a>
                    <a href="https://google.com" class="icon-link" title="Google Books" target="_blank">G</a>
                    <a href="https://youtube.com" class="icon-link" title="YouTube Channel" target="_blank">Y</a>
                    <a href="#" class="icon-link" title="Discord">D</a>
                    <a href="#" class="icon-link" title="Contact">?</a>
                </div>
            </div>

            <!-- Custom Runic Emblem Anchor Point -->
            <div class="medallion-box">
                <img src="runic-medallion.png" alt="Waters of Yersu Medallion">
            </div>
        </div>

        <!-- 4-Column Video Gallery Grid Row -->
        <div class="video-panel">
            <div class="video-card">
                <iframe src="https://youtube.com/embed/j2OkPtxXWt8" allowfullscreen></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://youtube.com/embed/4c9W6motNRw" allowfullscreen></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://youtube.com/embed/ps6LxT-VKOc" allowfullscreen></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://youtube.com/embed/MyZd_Buecq8" allowfullscreen></iframe>
            </div>
        </div>

    </div>

</body>
</html>
