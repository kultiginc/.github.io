<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="runic-medallion.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waters of Yersu - Official Page</title>
    <style>
        /* Base Page Setup & Epic Yersu Background */
        body {
            margin: 0;
            padding: 0;
            background-image: url('yersu-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            width: 100%;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* The Main Layout Shield Wrapper */
        .wrapper {
            width: 95%;
            max-width: 1100px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            box-sizing: border-box;
        }

        /* Clickable Golden Kindle Promo Banner Link */
        .kindle-promo-link {
            text-decoration: none;
            display: inline-block;
        }

        .kindle-promo {
            margin: 0;
            font-size: 1.25rem;
            color: #d29a39; 
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(210, 154, 57, 0.4);
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Hover glow effect for the big orange text line */
        .kindle-promo-link:hover .kindle-promo {
            color: #ffbe4a;
            text-shadow: 0 0 20px rgba(210, 154, 57, 0.95);
            transform: scale(1.02);
        }

        /* Seamless Row of Compact Storefront Navigation Icons */
        .icon-bar {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .icon-link {
            width: 40px;
            height: 40px;
            border: 2px solid #8fa3a6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #8fa3a6;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9rem;
            background: transparent;
            box-sizing: border-box;
        }

        /* Hover Behavior for standard buttons */
        .icon-link:hover {
            border-color: #59e5d6;
            color: #59e5d6;
            box-shadow: 0 0 12px #59e5d6; 
            transform: translateY(-2px);
        }

        /* Custom Medallion App Icon Configuration for Amazon */
        .icon-link.amazon-btn {
            background-image: url('amazon-icon.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Hover state: Gold glow anchor */
        .icon-link.amazon-btn:hover {
            box-shadow: 0 0 12px rgba(210, 154, 57, 0.95);
            transform: scale(1.05) translateY(-2px);
        }

        /* Click state: Pure high-intensity Yersu teal flash */
        .icon-link.amazon-btn:active {
            box-shadow: 0 0 16px rgba(89, 229, 214, 0.98);
            transform: scale(0.98);
        }

        /* Custom Medallion App Icon Configuration for Gumroad */
        .icon-link.gumroad-btn {
            background-image: url('gumroad-icon.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Hover state: Gold glow anchor (Matching Amazon) */
        .icon-link.gumroad-btn:hover {
            box-shadow: 0 0 12px rgba(210, 154, 57, 0.95);
            transform: scale(1.05) translateY(-2px);
        }

        /* Click state: Pure high-intensity Yersu teal flash (Matching Amazon) */
        .icon-link.gumroad-btn:active {
            box-shadow: 0 0 16px rgba(89, 229, 214, 0.98);
            transform: scale(0.98);
        }

        /* Custom Medallion App Icon Configuration for GlobalComix */
        .icon-link.globalcomix-btn {
            background-image: url('globalcomix.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        /* Hover state: Gold glow anchor (Matching Amazon/Gumroad) */
        .icon-link.globalcomix-btn:hover {
            box-shadow: 0 0 12px rgba(210, 154, 57, 0.95);
            transform: scale(1.05) translateY(-2px);
        }

        /* Click state: Pure high-intensity Yersu teal flash (Matching Amazon/Gumroad) */
        .icon-link.globalcomix-btn:active {
            box-shadow: 0 0 16px rgba(89, 229, 214, 0.98);
            transform: scale(0.98);
        }
        
        /* --- THE GIANT YERSU CIRCULAR TOOLTIP ENGINE --- */
        .custom-tooltip-wrapper {
            position: relative;
            display: inline-block;
        }

        .yersu-tooltip-text {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 140%; 
            left: 50%;
            transform: translateX(-50%) translateY(15px);
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 20px rgba(89, 229, 214, 0.4);
            border-radius: 50px; 
            padding: 15px 35px; 
            color: #59e5d6; 
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(89, 229, 214, 0.5);
            white-space: nowrap;
            z-index: 1000;
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
        }

        .custom-tooltip-wrapper:hover .yersu-tooltip-text {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- NEW READERS INFO TEXT BOX PANEL (80% Opacity) --- */
        .info-panel {
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid #59e5d6;
            box-shadow: 0 0 25px rgba(89, 229, 214, 0.3);
            border-radius: 4px;
            padding: 30px 40px;
            box-sizing: border-box;
        }

        .info-panel ul {
            margin: 0;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-panel li {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #d29a39;
            letter-spacing: 0.5px;
            font-weight: 500;
            text-shadow: 0 0 5px rgba(210, 154, 57, 0.2);
        }

        .info-panel li strong {
            color: #59e5d6;
            text-shadow: 0 0 8px rgba(89, 229, 214, 0.4);
        }

        .info-panel p {
            margin: 20px 0 0 0;
            font-size: 1.1rem;
            color: #d29a39;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* --- THE THEATER HOUSING (KR?T?K DÜZENLEME) --- */
        .hero-theater {
            position: relative;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid #59e5d6;
            box-shadow: 0 0 25px #59e5d6;
            border-radius: 4px;
            overflow: hidden;
            display: block; /* Eski çak??an esnek kutu (flex) kurallar?n? s?f?rlar */
            box-sizing: border-box;
            padding: 20px 0 0 0;
        }

        /* Ortak Kanvas Hizalama Alan? */
        .portal-canvas {
            position: relative;
            width: 100%;
            max-width: 1000px; /* Photoshop ana kanvas geni?li?inize göre buray? güncelleyin */
            margin: 0 auto;
            display: block;
        }

        /* Katman 1: Sabit Ba?l?k Logosu Grafi?i */
        .headline-base-layer {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
        }

        /* Katman 2: Üzerine Tam Oturan T?klanabilir Katman */
        .medallion-clickable-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Katman 2b: Sürekli Dönen Etkinle?tirme Madalyonu */
        .medallion-spinning-asset {
            width: 32%; /* Ba?l???n alt?ndaki hilal ???k çizgisine kusursuz oturmas? için ölçek */
            height: auto;
            cursor: pointer;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            margin-top: 18%; /* Madalyonu tam olarak parlama yay?na oturtmak için a?a?? çeker */
            animation: spinArtifact 25s linear infinite;
            transition: filter 0.5s ease;
        }

        @keyframes spinArtifact {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .medallion-spinning-asset:hover {
            filter: drop-shadow(0 0 15px rgba(210, 154, 57, 0.85));
        }

        .medallion-spinning-asset.activated {
            filter: drop-shadow(0 0 20px rgba(89, 229, 214, 0.95)) brightness(1.2);
        }

        /* Alt Navigasyon Kontrol Paneli Alan? */
        .dashboard-content {
            width: 100%;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.95);
            position: relative;
            z-index: 15;
            border-top: 1px solid rgba(89, 229, 214, 0.15);
        }

        .artifact-instruction-text {
            font-size: 0.95rem;
            color: #d29a39; 
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(210, 154, 57, 0.2);
            text-align: center;
            margin: 0;
        }

        /* Dinamik E-posta Kay?t Alan? Paneli */
        .email-reveal-zone {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        .email-reveal-zone.show {
            max-height: 80px;
            opacity: 1;
        }

        .runic-input {
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid #59e5d6;
            border-radius: 4px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 1rem;
            letter-spacing: 2px;
            text-align: center;
            width: 280px;
            outline: none;
            box-shadow: 0 0 10px rgba(89, 229, 214, 0.2);
        }

        .runic-input:focus {
            box-shadow: 0 0 15px rgba(89, 229, 214, 0.6);
            border-color: #ffffff;
        }

        .dashboard-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .dashboard-meta p {
            margin: 0;
            font-size: 1rem;
            color: #8fa3a6;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* 5 Sütunlu YouTube Oynat?c? Izgaras? */
        .video-panel {
            background-color: #000000;
            border: 2px solid #59e5d6; 
            box-shadow: 0 0 25px #59e5d6; 
            border-radius: 4px;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .video-card {
            position: relative;
            width: 100%;
            padding-top: 177.77%; 
            border-radius: 4px;
            overflow: hidden;
            background-color: #111;
        }

        .video-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Mobil Cihazlar ?çin Uyarl?k Kurallar? */
        @media (max-width: 768px) {
            .wrapper {
                margin: 15px auto;
                gap: 20px;
            }

            .medallion-spinning-asset {
                width: 50%;
                margin-top: 25%;
            }

            .dashboard-content {
                padding: 20px 15px;
            }

            .dashboard-meta {
                gap: 15px;
            }

            .kindle-promo {
                font-size: 1.05rem;
                text-align: center;
            }

            .yersu-tooltip-text {
                font-size: 1rem;
                padding: 10px 20px;
                white-space: normal;
                width: 230px;
                text-align: center;
                border-radius: 20px;
            }

            .info-panel {
                padding: 20px;
            }

            .info-panel li {
                font-size: 1rem;
            }

            .video-panel {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .video-card {
                max-width: 290px;
                margin: 0 auto;
            }
        }
    <div class="wrapper">
        
        <!-- --- P?KSEL KUSURSUZ KAHRAMAN SAHNES? (GÜNCELLENEN ANA GÖVDE) --- -->
        <div class="hero-theater">
            
            <!-- Payla??lan Kanvas E?leme Alan? -->
            <div class="portal-canvas">
                <!-- Katman 1: Merkezi Ba?l?k Logosu (I??k hüzmeleri ve sabit hilal ???k efekti dahildir) -->
                <img src="headline-logo.png" alt="Waters of Yersu" class="headline-base-layer">
                
                <!-- Katman 2: Ayn? Boyutlardaki T?klanabilir Katman Konteyneri -->
                <div class="medallion-clickable-overlay">
                    <!-- Katman 2b: Dönen Madalyon ?nteraktif Tetikleyici Görseli -->
                    <img src="runic-medallion.png" id="artifactBtn" class="medallion-spinning-asset" alt="Click to activate artifact" title="Click to activate artifact">
                </div>
            </div>

            <!-- Alt Navigasyon Kontrol Paneli (Görsellerin hemen alt?nda pürüzsüzce birle?ir) -->
            <div class="dashboard-content">
                
                <h2 class="artifact-instruction-text">Activate the artifact to reach Yersu</h2>
                
                <!-- Dinamik E-posta Kay?t Alan? -->
                <div id="revealZone" class="email-reveal-zone">
                    <form id="topEmailForm" action="#" method="POST">
                        <input type="email" name="email" class="runic-input" placeholder="ENTER EMAIL TO COMPLETE..." required>
                    </form>
                </div>

                <!-- Genel Bilgi ve Link Sat?rlar? -->
                <div class="dashboard-meta">
                    <p>Official Page (Under Construction)</p>
                    
                    <a href="#" class="kindle-promo-link">
                        <h3 class="kindle-promo">ISSUE 1 AND 2 ARE LIVE ON GUMROAD FOR A LIMITED TIME</h3>
                    </a>

                    <!-- Navigasyon ?konlar? Dizilimi -->
                    <div class="icon-bar">
                        <!-- Amazon Kindle Butonu -->
                        <div class="custom-tooltip-wrapper">
                            <a href="#" id="topLinkAmazon" class="icon-link amazon-btn" target="_blank"></a>
                            <span class="yersu-tooltip-text">BUY FROM AMAZON KINDLE</span>
                        </div>

                        <!-- Gumroad Butonu -->
                        <div class="custom-tooltip-wrapper">
                            <a href="#" id="topLinkGumroad" class="icon-link gumroad-btn" target="_blank"></a>
                            <span class="yersu-tooltip-text">READ ISSUE 1 & 2 FOR FREE ON GUMROAD FOR A LIMITED TIME!</span>
                        </div>

                        <!-- GlobalComix Butonu -->
                        <div class="custom-tooltip-wrapper">
                            <a href="#" id="topLinkGlobalComix" class="icon-link globalcomix-btn" target="_blank"></a>
                            <span class="yersu-tooltip-text">READ ON GLOBAL COMIX HERE!</span>
                        </div>
                        
                        <a href="#" id="topLinkDiscord" class="icon-link" title="Discord" target="_blank">D</a>
                        <a href="#" id="topLinkContact" class="icon-link" title="Contact">?</a>
                    </div>
                </div>

            </div>
        </div>

        <!-- Okuyucu Bilgilendirme Paneli -->
        <div class="info-panel">
            <ul>
                <li>You can read the comics for <strong>FREE</strong> on Gumroad. It requires an email address: simply enter your email, select "<strong>$0</strong>" at checkout, and continue.</li>
                <li>You can also read them for <strong>FREE</strong> on GlobalComix. Please note that GlobalComix requires a premium membership starting from Issue 2.</li>
                <li>You can get paperback and digital versions of the comics on Amazon Kindle. If you would truly like to support this project, purchasing them from Amazon is the best way to do so!</li>
            </ul>
            <p>The corresponding navigation icons are located above. I hope you enjoy the journey!</p>
        </div>

        <!-- 5 Sütunlu YouTube Oynat?c? Izgaras? -->
        <div class="video-panel">
            <div class="video-card">
                <iframe id="vidEmbed1" src="" title="Yersu Teaser" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe id="vidEmbed2" src="" title="Ong Teaser" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe id="vidEmbed3" src="" title="Selen Teaser" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe id="vidEmbed4" src="" title="Teaser 4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
            <div class="video-card">
                <iframe id="vidEmbed5" src="" title="Teaser 5" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="true"></iframe>
            </div>
        </div>

    </div>

    <!-- Merkezi Dinamik Link Yönlendirme Sistemi -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const getUrl = (id) => {
                const el = document.getElementById(id);
                return el ? el.innerText.trim() : "";
            };

            const amazonUrl = getUrl("urlAmazon");
            const gumroadUrl = getUrl("urlGumroad");
            const globalComixUrl = getUrl("urlGlobalComix");
            const discordUrl = getUrl("urlDiscord");
            const contactUrl = getUrl("urlContact");
            const formspreeUrl = getUrl("urlFormspree");
            
            const v1 = getUrl("urlVid1");
            const v2 = getUrl("urlVid2");
            const v3 = getUrl("urlVid3");
            const v4 = getUrl("urlVid4");
            const v5 = getUrl("urlVid5");

            if(document.getElementById("topLinkAmazon")) document.getElementById("topLinkAmazon").href = amazonUrl;
            if(document.getElementById("topLinkGumroad")) document.getElementById("topLinkGumroad").href = gumroadUrl;
            if(document.getElementById("topLinkGlobalComix")) document.getElementById("topLinkGlobalComix").href = globalComixUrl;
            if(document.getElementById("topLinkDiscord")) document.getElementById("topLinkDiscord").href = discordUrl;
            if(document.getElementById("topLinkContact")) document.getElementById("topLinkContact").href = contactUrl;
            if(document.getElementById("topEmailForm")) document.getElementById("topEmailForm").action = formspreeUrl;

            if(document.getElementById("vidEmbed1")) document.getElementById("vidEmbed1").src = v1;
            if(document.getElementById("vidEmbed2")) document.getElementById("vidEmbed2").src = v2;
            if(document.getElementById("vidEmbed3")) document.getElementById("vidEmbed3").src = v3;
            if(document.getElementById("vidEmbed4")) document.getElementById("vidEmbed4").src = v4;
            if(document.getElementById("vidEmbed5")) document.getElementById("vidEmbed5").src = v5;
        });

        // Madalyon Animasyon ve Aç?l?? Mant???
        const artifactBtn = document.getElementById('artifactBtn');
        const revealZone = document.getElementById('revealZone');
        const heroTheater = document.querySelector('.hero-theater');

        if (artifactBtn && revealZone) {
            artifactBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                artifactBtn.classList.toggle('activated');
                revealZone.classList.toggle('show');
            });

            document.addEventListener('click', (e) => {
                if (heroTheater && !heroTheater.contains(e.target)) {
                    artifactBtn.classList.remove('activated');
                    revealZone.classList.remove('show');
                }
            });
        }
    </script>
