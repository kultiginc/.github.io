<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waters of Yersu - Official Page</title>
    <style>
        body {
            background-color: #050a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            border: 2px solid #59e5d6;
            box-shadow: 0 0 20px rgba(89, 229, 214, 0.2);
            border-radius: 12px;
            background: rgba(5, 10, 10, 0.85);
            margin: 20px;
        }

        /* The container setup for your artifact rotation and lighting layer */
        .artifact-stack {
            position: relative; /* Crucial: pins the ::after pseudo-element to this block */
            width: 320px;
            height: 320px;
            margin: 0 auto 30px auto;
        }

        /* Your spinning golden medallion asset */
        .artifact-stack img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: rotateArtifact 25s linear infinite;
        }

        /* --- YOUR INJECTED SHINE LAYER CODE --- */
        .artifact-stack::after {
            content: "";
            position: absolute;
            left: 13%;
            top: 8%;
            width: 74%;
            height: 42%;
            pointer-events: none;
            z-index: 2;
            border-radius: 50%;
            background:
                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(89, 229, 214, 0.65) 0%,
                    rgba(89, 229, 214, 0.32) 25%,
                    rgba(89, 229, 214, 0.12) 48%,
                    transparent 72%
                );
            -webkit-mask-image:
                linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
            mask-image:
                linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
            filter: blur(3px);
            mix-blend-mode: screen;
        }

        @keyframes rotateArtifact {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            color: #59e5d6;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 1.4rem;
        }

        .status-text {
            color: #8fa09e;
            font-size: 0.95rem;
            margin-bottom: 25px;
            font-style: italic;
        }

        .announcement {
            color: #e5b859;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* Footer Social and Store Icon Links */
        .social-row {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .social-row a {
            display: inline-block;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .social-row a:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px #59e5d6);
        }

        .social-row img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .info-box {
            border: 1px solid rgba(89, 229, 214, 0.4);
            background: rgba(89, 229, 214, 0.05);
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .info-box ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
            color: #cbdcd9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Artifact Stack Component with Injected Shine Layer -->
        <div class="artifact-stack">
            <!-- Simulated image using your repository configuration -->
            <img src="Runic-Medallion.png" alt="Yersu Runic Medallion">
        </div>

        <h1>Activate the artifact to reach yersu</h1>
        <div class="status-text">Official Page (Under Construction)</div>

        <div class="announcement">ISSUE 1 AND 2 ARE LIVE ON GUMROAD FOR A LIMITED TIME</div>

        <!-- Social Navigation Row -->
        <div class="social-row">
            <a href="https://gumroad.com" target="_blank">
                <img src="gumroad-icon.png" alt="Gumroad Account">
            </a>
            <a href="https://play.google.com/store/books/series?id=eTW3HAAAAABDPKM" target="_blank">
                <img src="google-play.png" alt="Google Play Books">
            </a>
            <a href="#" target="_blank">
                <img src="shine.png" alt="Social Platform">
            </a>
        </div>

        <div class="info-box">
            <ul>
                <li>You can read the comics for <strong>FREE</strong> on Gumroad. It requires an email address: simply enter your email, select "$0" at checkout, and continue.</li>
            </ul>
        </div>
    </div>

</body>
</html>
